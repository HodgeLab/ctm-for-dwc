[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transportation-models"
version = "0.1.0"
dependencies = [
    "beautifulsoup4",
    "geopandas",
    "ipykernel",
    "ipython",
    "matplotlib",
    "mechanize",
    "networkx",
    "numpy",
    "osm2gmns",
    "pandas",
    "python-dotenv",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "torch",
    "torch-geometric",
    "torchvision",
    "wandb"
]
requires-python = ">= 3.10"
authors = [{ name = "Rob Stallman", email = "robstallman3@gmail.com" }]
description = "Code to analyze and develop models of transportation data "
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

[project.optional-dependencies]
test = ["pytest", "pytest-dotenv"]

[project.urls]
Repository = "https://github.com/HodgeLab/transportation-models"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
