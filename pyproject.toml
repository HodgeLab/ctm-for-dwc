[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctm-for-dwc"
version = "1.0.0"
dependencies = [
    "beautifulsoup4",
    "geopandas",
    "ipykernel",
    "ipython",
    "matplotlib",
    "mechanize",
    "networkx",
    "numpy",
    "osmnx",
    "pandas",
    "python-dotenv",
    "scikit-learn",
    "scipy",
    "torch",
    "wandb"
]
requires-python = ">= 3.10"
authors = [{ name = "Rob Stallman", email = "rob.stallman@colorado.edu" }]
description = "Accompaniment to the paper 'Scalable Load Models for Dynamic Wireless Charging of Electric Vehicles in Power Systems.' The project uses Caltrans PeMS data to calibrate a Cell Transmission Model (CTM) for freeway traffic flow simulation, which feeds a projection of the energy demand from dynamic wireless charging (DWC) of electric vehicles (EVs)."
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]

[project.optional-dependencies]
test = ["pytest", "pytest-dotenv"]

[project.urls]
Repository = "https://github.com/HodgeLab/ctm-for-dwc"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "network: hits a live external service (default-skip in CI; run with `pytest -m network`)",
    "slow: long-running (e.g. end-to-end microsim validation; run with `pytest -m slow`)",
]
addopts = "-m 'not network and not slow'"
